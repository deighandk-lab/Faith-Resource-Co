<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bibles | Faith Resource Co.</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

body{
font-family:Inter;
background:#F5F1EA;
margin:0;
color:#2B2B2B;
}

.container{
width:90%;
max-width:1100px;
margin:auto;
}

.logo{
font-family:'Cormorant Garamond';
font-size:30px;
font-weight:700;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 0;
border-bottom:1px solid #DDD4C8;
}

h1{
font-family:'Cormorant Garamond';
font-size:48px;
text-align:center;
margin:40px 0 10px;
}

p.desc{
text-align:center;
color:#6B6259;
max-width:800px;
margin:auto;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
margin-top:40px;
}

.card{
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,0.05);
}

.card img{
width:100%;
height:260px;
object-fit:cover;
}

.card-body{
padding:20px;
}

.price{
font-weight:600;
margin:10px 0;
}

.btn{
display:block;
text-align:center;
padding:12px;
background:#2B2B2B;
color:white;
text-decoration:none;
border-radius:12px;
}

</style>
</head>

<body>

<header class="container">
<div class="logo"><a href="../index.html">Faith Resource Co.</a></div>
</header>

<div class="container">

<h1 id="title">Bible</h1>
<p class="desc" id="desc"></p>

<div class="grid" id="products"></div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const type = params.get("type") || "AMP";

fetch("../data/bibles.json")
.then(res => res.json())
.then(data => {

const bible = data[type];

document.getElementById("title").innerText = bible.title;
document.getElementById("desc").innerText = bible.description;

const container = document.getElementById("products");

bible.products.forEach(p => {

container.innerHTML += `
<div class="card">
<img src="${p.image}">
<div class="card-body">
<h3>${p.name}</h3>
<p>${p.desc}</p>
<div class="price">R${p.price}</div>
<a class="btn" href="https://wa.me/27815620614?text=Hi I want ${p.name}">Order on WhatsApp</a>
</div>
</div>
`;

});

});
</script>

</body>
</html>
